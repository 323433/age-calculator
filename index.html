<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年龄计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #8ec5fc 0%, #e0c3fc 45%, #fbc2eb 100%);
    -webkit-font-smoothing: antialiased;
  }

  .glass-card {
    width: 100%;
    max-width: 400px;
    padding: 44px 36px 38px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.22);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 12px 40px rgba(31, 38, 135, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .app-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 16px rgba(31, 38, 135, 0.12);
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 2px rgba(31, 38, 135, 0.15);
    letter-spacing: 1px;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 13px;
    text-align: center;
    color: rgba(255, 255, 255, 0.75);
  }

  .field {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    padding-left: 4px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    height: 52px;
    padding: 0 18px;
    font-size: 18px;
    font-weight: 500;
    color: #2c3e50;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 16px;
    outline: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 3px rgba(31, 38, 135, 0.08);
    transition: box-shadow .2s, background .2s;
  }

  input:focus {
    background: rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.35);
  }

  input::placeholder { color: rgba(44, 62, 80, 0.35); }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  button {
    width: 88px;
    height: 52px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 6px 18px rgba(102, 126, 234, 0.45);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .15s;
  }

  button:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(102, 126, 234, 0.55); }
  button:active { transform: scale(0.97); opacity: 0.9; }

  .result-area {
    margin-top: 26px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 18px 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: opacity .25s;
  }

  .result-area .age {
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 8px rgba(31, 38, 135, 0.25);
    line-height: 1.1;
  }

  .result-area .age small {
    font-size: 20px;
    font-weight: 600;
  }

  .result-area .detail {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.85);
  }

  .result-area .hint {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
  }

  .result-area.hidden { opacity: 0; }

  .footer {
    margin-top: 22px;
    font-size: 11px;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
  }
</style>
</head>
<body>
  <div class="glass-card">
    <div class="app-icon">🎂</div>
    <h1>年龄计算器</h1>
    <p class="subtitle">输入出生年份，一键算出你的年纪</p>

    <div class="field">
      <label for="birthYear">出生年份</label>
      <div class="input-row">
        <input type="number" id="birthYear" placeholder="例如 1995" min="1900" inputmode="numeric" autofocus>
        <button id="calcBtn">计算</button>
      </div>
    </div>

    <div class="result-area hidden" id="result">
      <div class="age" id="ageText"></div>
      <div class="detail" id="detailText"></div>
    </div>

    <p class="footer">仅需年份，即可知晓岁月几何</p>
  </div>

<script>
  (function () {
    var input = document.getElementById('birthYear');
    var btn = document.getElementById('calcBtn');
    var result = document.getElementById('result');
    var ageText = document.getElementById('ageText');
    var detailText = document.getElementById('detailText');

    var currentYear = new Date().getFullYear();
    var currentMonth = new Date().getMonth() + 1;
    var currentDay = new Date().getDate();

    function showAge(year) {
      var age = currentYear - year;
      var ageStr = String(age);
      ageText.innerHTML = ageStr + '<small> 岁</small>';
      detailText.textContent = year + ' 年出生 · 现在是 ' + currentYear + ' 年';
      result.classList.remove('hidden');
    }

    function showError(msg) {
      ageText.textContent = '';
      ageText.innerHTML = '';
      detailText.textContent = msg;
      result.classList.remove('hidden');
    }

    function calc() {
      var raw = input.value.trim();
      if (!raw) {
        showError('请输入出生年份');
        return;
      }
      var year = parseInt(raw, 10);
      if (isNaN(year) || !/^\d{4}$/.test(raw)) {
        showError('请输入 4 位年份，例如 1995');
        return;
      }
      if (year > currentYear) {
        showError('年份不能晚于 ' + currentYear + ' 年');
        return;
      }
      if (year < 1900) {
        showError('请输入 1900 年以后的年份');
        return;
      }
      showAge(year);
    }

    btn.addEventListener('click', calc);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') calc();
    });
  })();
</script>
</body>
</html>
